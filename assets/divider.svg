<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="8" viewBox="0 0 1200 8" role="presentation">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F28C28" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#F28C28" stop-opacity="0.45"/>
      <stop offset="0.8" stop-color="#F28C28" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#F28C28" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD9A8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFD9A8" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFD9A8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="3" width="1200" height="2" rx="1" fill="url(#base)"/>
  <rect y="2" width="220" height="4" rx="2" fill="url(#shine)">
    <animate attributeName="x" values="-220;1200" dur="4.5s" repeatCount="indefinite"/>
  </rect>
</svg>
