<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Pheterson Ferry Fernando. Web, mobile and desktop apps. Pontianak, Indonesia.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#141D33"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F28C28" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#F28C28" stop-opacity="0.55"/>
      <stop offset="0.85" stop-color="#F28C28" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F28C28" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#dots)"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="80" y="96" fill="#F28C28" font-size="16" font-weight="600" letter-spacing="5">UNICLOWNS</text>
    <text x="78" y="160" fill="#F5F1EA" font-size="54" font-weight="700">Pheterson Ferry Fernando</text>
    <text x="80" y="204" fill="#9AA7BD" font-size="23">Web, mobile and desktop apps · Pontianak, Indonesia</text>
  </g>

  <!-- The equator runs through Pontianak. -->
  <line x1="40" y1="250" x2="1160" y2="250" stroke="url(#line)" stroke-width="2" stroke-dasharray="6 8"/>
  <text x="1120" y="278" fill="#F28C28" fill-opacity="0.75" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">0°</text>
  <circle cy="250" r="4" fill="#F28C28">
    <animate attributeName="cx" values="60;1140" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="10s" repeatCount="indefinite"/>
  </circle>
</svg>
